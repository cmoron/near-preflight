[package]
name = "goblin-near"
version = "0.1.0"
edition = "2021"
description = "Garde de depense pour agents : credit prepaye, budget arme avec echeance"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
